services:
  app:
    build:
      context: .
    image: miloshvpn:dev
    container_name: miloshvpn-dev
    restart: unless-stopped
    ports:
      - "${DEV_APP_PORT:-8081}:80"
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
